<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TikTok callback</title><link rel="icon" type="image/png" href="../../mars-logo.png"></head>
<body style="font-family:sans-serif;text-align:center;padding-top:50px">
<h2>TikTok Authorization</h2>
<p id="code" style="font-size:18px;word-break:break-all"></p>
<p id="err" style="color:red"></p>
<script>
const p = new URLSearchParams(location.search);
if (p.get("code")) { document.getElementById("code").textContent = "CODE: " + p.get("code"); }
else { document.getElementById("err").textContent = "No code in URL — authorization was cancelled or failed: " + location.href; }
</script>
</body></html>
