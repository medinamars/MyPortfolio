<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../mars-logo.png">
  <title>MedinaMars - AnimeTTL</title>
  <meta name="description" content="MedinaMars - AnimeTTL — anime video content published on YouTube, Instagram, TikTok, X and other web platforms.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #0b0d17;
      color: #c4a882;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 3.5rem;
      color: #7eb8da;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #8a7560;
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }
    a {
      color: #d4a55a;
      text-decoration: none;
      font-size: 1.05rem;
    }
    a:hover {
      text-decoration: underline;
    }
    .back-link {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: 1px solid #2a2d3e;
      border-radius: 4px;
      color: #7eb8da;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .back-link:hover {
      border-color: #d4a55a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MedinaMars - AnimeTTL</h1>
    <p class="subtitle">Anime video content published on YouTube, Instagram, TikTok, X and other web platforms.</p>
    <div class="links">
      <a href="PrivacyPolicy/">Privacy Policy</a>
      <a href="TermsOfService/">Terms of Service</a>
      <a href="TikTokCallback/">TikTok Authorization</a>
    </div>
    <a href="https://medinamars.github.io/MyPortfolio" class="back-link">← Back to Portfolio</a>
  </div>
</body>
</html>
